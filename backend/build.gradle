plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'io.github.suover'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'repository.root', rootProject.projectDir.parentFile.absolutePath
    systemProperty 'test.migration.runner', providers.gradleProperty('migrationRunner').getOrElse('uv')
    testLogging { events 'failed', 'skipped'; exceptionFormat 'short' }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }

// Used by the local, console-only password hash tool; no server or DB is started.
tasks.register('adminHashClasspath') {
    doLast {
        println configurations.runtimeClasspath.files.find { it.name.startsWith('spring-security-crypto-') }.absolutePath
    }
}
