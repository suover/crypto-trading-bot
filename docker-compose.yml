x-app-environment: &app-environment
  APP_ENV: docker
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: crypto_trading_bot
  DATABASE_USER: trading_user
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  UPBIT_ACCESS_KEY_FILE: /run/secrets/upbit_access_key
  UPBIT_SECRET_KEY_FILE: /run/secrets/upbit_secret_key
  TZ: Asia/Seoul

x-app-secrets: &app-secrets
  - postgres_password
  - openai_api_key
  - telegram_bot_token
  - upbit_access_key
  - upbit_secret_key

services:
  postgres:
    image: postgres:17
    container_name: crypto-trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto_trading_bot
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Seoul
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d crypto_trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  ai-trade-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-ai-trade-analysis
    profiles:
      - manual
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_ai_trade_analysis"]

  ai-trade-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-ai-trade-scheduler
    profiles:
      - scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "python",
        "-m",
        "scripts.run_ai_trade_scheduler",
      ]

  telegram-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-telegram-listener
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_telegram_approval_listener"]

  mock-order-retry-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-mock-order-retry-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "python",
        "-m",
        "scripts.run_mock_order_retry_worker",
        "--interval-seconds",
        "60",
      ]

  live-order-reconciliation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-live-order-reconciliation-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_live_order_reconciliation_worker"]

  account-activity-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-account-activity-sync-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: crypto_trading_bot
      DATABASE_USER: trading_user
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_TOKEN_FILE: ""
      UPBIT_ACCESS_KEY_FILE: /run/secrets/upbit_access_key
      UPBIT_SECRET_KEY_FILE: /run/secrets/upbit_secret_key
      TZ: Asia/Seoul
    secrets:
      - postgres_password
      - upbit_access_key
      - upbit_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_account_activity_sync_worker"]

  bot-trading-pnl-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-bot-trading-pnl-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: crypto_trading_bot
      DATABASE_USER: trading_user
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_TOKEN_FILE: ""
      UPBIT_ACCESS_KEY: ""
      UPBIT_ACCESS_KEY_FILE: ""
      UPBIT_SECRET_KEY: ""
      UPBIT_SECRET_KEY_FILE: ""
      TZ: Asia/Seoul
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_bot_trading_pnl_worker"]

  portfolio-performance-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-portfolio-performance-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: crypto_trading_bot
      DATABASE_USER: trading_user
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_TOKEN_FILE: ""
      UPBIT_ACCESS_KEY: ""
      UPBIT_ACCESS_KEY_FILE: ""
      UPBIT_SECRET_KEY: ""
      UPBIT_SECRET_KEY_FILE: ""
      TZ: Asia/Seoul
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_portfolio_performance_worker"]

  operational-alert-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-operational-alert-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: crypto_trading_bot
      DATABASE_USER: trading_user
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
      UPBIT_ACCESS_KEY: ""
      UPBIT_ACCESS_KEY_FILE: ""
      UPBIT_SECRET_KEY: ""
      UPBIT_SECRET_KEY_FILE: ""
      TZ: Asia/Seoul
    secrets:
      - postgres_password
      - telegram_bot_token
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.run_operational_alert_worker"]

secrets:
  postgres_password:
    file: ${SECRET_DIR:-.secrets}/postgres_password
  openai_api_key:
    file: ${SECRET_DIR:-.secrets}/openai_api_key
  telegram_bot_token:
    file: ${SECRET_DIR:-.secrets}/telegram_bot_token
  upbit_access_key:
    file: ${SECRET_DIR:-.secrets}/upbit_access_key
  upbit_secret_key:
    file: ${SECRET_DIR:-.secrets}/upbit_secret_key

volumes:
  postgres_data:
