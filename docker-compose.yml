services:
  postgres:
    image: postgres:17
    container_name: crypto-trading-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crypto_trading_bot
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pass
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d crypto_trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: