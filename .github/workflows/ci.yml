name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ruff, Pytest, and Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto
          POSTGRES_DB: crypto_trading_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto -d crypto_trading_bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://crypto:crypto@localhost:5432/crypto_trading_bot
      OPENAI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      UPBIT_ACCESS_KEY: ""
      UPBIT_SECRET_KEY: ""
      TRADING_MODE: AI_APPROVAL
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Prepare Docker Compose config files
        run: |
          cp .env.example .env
          mkdir -p .secrets
          printf '%s' 'crypto' > .secrets/postgres_password
          printf '%s' 'ci-placeholder' > .secrets/openai_api_key
          printf '%s' 'ci-placeholder' > .secrets/telegram_bot_token
          printf '%s' 'ci-placeholder' > .secrets/upbit_access_key
          printf '%s' 'ci-placeholder' > .secrets/upbit_secret_key

      - name: Validate Docker Compose config
        run: docker compose --profile manual config --quiet

      - name: Build Docker runtime images
        run: docker compose --profile manual build
