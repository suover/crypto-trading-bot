name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ruff, Pytest, and Docker
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto
          POSTGRES_DB: crypto_trading_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto -d crypto_trading_bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://crypto:crypto@localhost:5432/crypto_trading_bot
      OPENAI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      UPBIT_ACCESS_KEY: ""
      UPBIT_SECRET_KEY: ""
      TRADING_MODE: AI_APPROVAL
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "trading-engine/.python-version"

      - name: Install dependencies
        working-directory: trading-engine
        run: uv sync --dev --locked

      - name: Run database migrations
        working-directory: trading-engine
        run: uv run alembic upgrade head

      - name: Ruff format check
        working-directory: trading-engine
        run: uv run ruff format --check .

      - name: Ruff lint check
        working-directory: trading-engine
        run: uv run ruff check .

      - name: Run tests
        working-directory: trading-engine
        run: uv run pytest -q

      - name: Validate shell syntax
        run: |
          bash -n scripts/check_server_runtime_safety.sh
          bash -n scripts/deploy_production.sh
          bash -n scripts/backup_db.sh

      - name: Prepare Docker Compose config files
        run: |
          cp .env.example .env
          mkdir -p .secrets
          printf '%s' 'crypto' > .secrets/postgres_password
          printf '%s' 'ci-placeholder' > .secrets/openai_api_key
          printf '%s' 'ci-placeholder' > .secrets/telegram_bot_token
          printf '%s' 'ci-placeholder' > .secrets/upbit_access_key
          printf '%s' 'ci-placeholder' > .secrets/upbit_secret_key

      - name: Validate Docker Compose config
        run: docker compose --profile manual --profile scheduler config --quiet

      - name: Build Docker runtime images
        run: docker compose --profile manual --profile scheduler build
