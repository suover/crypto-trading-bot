worker_processes auto;
pid /tmp/nginx.pid;
# Lower-severity error messages can include a raw request URI/query string.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No query strings, usernames, cookies or request bodies in access logs.
    log_format safe '$remote_addr $request_method $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    map $request_method $login_client {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $login_client zone=login:1m rate=10r/m;
    limit_req_status 429;
    map $uri $response_cache_control {
        default no-cache;
        /release.json no-store;
        ~^/api no-store;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $response_cache_control always;

        location = /api { return 404; }
        location = /api/v1/auth/login {
            limit_req zone=login burst=9 nodelay;
            error_page 429 = @throttled;
            include /etc/nginx/web-api.conf;
        }
        location @throttled {
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 429;
        }
        location ^~ /api/ { include /etc/nginx/web-api.conf; }
        location = /healthz { access_log off; return 200 'ok'; }
        location = /release.json { try_files $uri =404; }
        location ^~ /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
