# Include inside the dashboard's HTTPS server block on the same host as Spring Boot.
root /var/www/crypto-trading-dashboard;
index index.html;

location = /api {
    add_header Cache-Control "no-store" always;
    return 404;
}

location ^~ /api/ {
    # Preserve the URI. Spring Security owns the allowed methods, routes and session checks.
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Real-IP "";
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location ^~ /assets/ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
